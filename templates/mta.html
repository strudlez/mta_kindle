<html>
  <head>
    <meta charset="utf-8">
    <title>Countdown</title>
    <link rel="stylesheet" href="mta/static/css/styles.css?v=5">
  </head>
  <body>
    <div class="body" id="main">
      <div id="offlineBanner" class="hidden" role="status">
        <span class="offline-left">OFFLINE <span id="offlineAge" class="offline-age"></span></span>
      </div>
      <button id="editStationsBtn" type="button" aria-label="Edit stations" title="Edit stations"><img class="edit-icon" src="mta/static/img/pencil.png" width="22" height="22" alt="Edit"></button>
      <div id="stations">
        <div id="station0" class="hidden">
          <div class="stationTitle"></div>
          <div class="directions">
            <div class="inbound direction">
              <div class="inboundTitle"></div>
              <div class="inbound1 train">
                <div class="trainColor"><div class="trainName"></div></div>
                <div class="countdown"></div>
                <div class="realtime"></div>
              </div>
              <div class="inbound2 train">
                <div class="trainColor"><div class="trainName"></div></div>
                <div class="countdown"></div>
                <div class="realtime"></div>
              </div>
              <div class="inbound3 train">
                <div class="trainColor"><div class="trainName"></div></div>
                <div class="countdown"></div>
                <div class="realtime"></div>
              </div>
            </div>
            <div class="outbound direction">
              <div class="outboundTitle"></div>
              <div class="outbound1 train">
                <div class="trainColor"><div class="trainName"></div></div>
                <div class="countdown"></div>
                <div class="realtime"></div>
              </div>
              <div class="outbound2 train">
                <div class="trainColor"><div class="trainName"></div></div>
                <div class="countdown"></div>
                <div class="realtime"></div>
              </div>
              <div class="outbound3 train">
                <div class="trainColor"><div class="trainName"></div></div>
                <div class="countdown"></div>
                <div class="realtime"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="offlineEmpty" class="hidden">Unable to reach MTA server. Retrying automatically...</div>
      <div class="alerts hidden">
        <div class="alertsTitle">Alerts </div>
        <div class="alertsBody"></div>
      </div>
      <div class="alerts2 hidden">
        <div class="alertsTitle">Alerts </div>
        <div class="alertsBody"></div>
      </div>
    </div>

    <div class="body hidden" id="picker">
      <div id="pickerManage">
        <div class="mta-bar">
          <span class="mta-title" id="pickerTitle">Stations</span>
          <span class="mta-actions">
            <button id="hidePickerBtn" class="btn-secondary" type="button">Cancel</button>
            <button id="savePickerBtn" class="btn-primary" type="button">Save</button>
          </span>
        </div>
        <div id="pickerList"></div>
      </div>
      <div id="pickerBrowse">
        <div id="pickerStepHeader"></div>
        <div id="pickerStepBody"></div>
      </div>
    </div>
    <script src="mta/static/js/js.js?v=5"></script>
  </body>
</html>
